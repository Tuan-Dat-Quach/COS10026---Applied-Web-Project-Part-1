<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- This is <meta> tags including charset, viewport, description, keywords, author of the webpage -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Recruitment Website for Greener Society! Here you can find out about the company's details,
        and of course, the opportunity to participate with us in conserving the environment!">
        <meta name="keywords" content="Environmental Conservation, GS, Greener Society, Protect Environment, Recruitment">
        <meta name="author" content="TideTech Group">
        <!-- This is the official title for our webpage -->
        <title>Greener Society - Recruitment Website</title>
        <link rel="stylesheet" href="styles/styles.css">
        <style>

        /*flexbox code*/

        .form {
            display: flex;
            align-content: center;
            justify-content: center;
            flex-direction: column;
            flex-wrap: wrap;
            align-items: center;

        }

        #form .form-item {
            font-size: 30px;
            width: fit-content ;
            margin: 0px auto;
            border: 1px solid;
            padding: 20px 50px;
            border-color: black;
        }


        </style>
    </head>

    <body>
        <div class="navigation">
            <!-- This is the official logo for the company, used throughout the page -->
            <!-- The image for Company Logo was generated using Gemini (Google, using 3.6 Flash Model, August 2026) -->
            <figure>
                <img id="company_logo" src="Images/Official_Company_Logo.png" alt="Greener_Society_Company_Logo">
            </figure>
            <!-- This is the consistent navigation bar, offering accessibility to users -->
            <nav>
                <ul id="menu"> 
                    <li> <a href="index.html"> 🪴 Home </a> </li>
                    <li> <a href="jobs.html"> 📝 Jobs </a> </li>
                    <li> <a href="apply.html"> 📄 Apply </a> </li>
                    <li> <a href="about.html"> 👥 About </a> </li>
                </ul>
            </nav>
        </div>
        
        <main style="text-align: center;">
            <!--code for the top sentences-->
            <div style="background-color: lightgoldenrodyellow;">
                <hr>
                <h1>🌲Thank you for considering a job at Greener Society!🌲</h1>
                <h2>🌏We look forward to your application and love your enthusiasm towards protecting our environment!🌏</h2>
                <hr>
            </div>
            <form id="form" action="http://mercury.swin.edu.au/it000000/formtest.php" method="post">
                <!--Form code, split into fieldsets-->
                <!--Each label is allocated its own respective input, with inline styling when needed-->
                <br>
                <label style="font-size: 30px;" for="Job Reference Number"><strong>Job Reference Number</strong></label>
                <input type="text" id="Job Reference Number" name="Job Reference Number" minlength="6" maxlength="6" pattern="GS102A|GS204B|GS305C" required>
                <br><br>
                <fieldset style="display: flex; background-color: lightgreen; " class="form-item">
                    <legend style="text-align: center;"><strong>Your details</strong></legend>
                    <br>
                    <div>
                        <label for="First Name">First Name</label>
                        <input type="text"  id="First Name" name="First Name" maxlength="20" pattern="[A-Za-z -]+" required>
                        <br><br>

                        <label for="Last Name">Last Name</label>
                        <input type="text" id="Last Name" name="Last Name" maxlength="20" pattern="[A-Za-z -]+" required>
                        <br><br>

                        <label for="Date of Birth">Date of Birth</label>
                        <input type="date" id="Date of Birth" name="Date of Birth" required>
                        <br><br>
                    </div>
                    <div>
                        <label for="Gender"> <strong>Gender</strong> </label>
                        <br>
                        <input type="radio" id="Male" name="Gender" value="Male" required>
                        <label for="Male">Male</label>
                        <br>
                        <input type="radio" id="Female" name="Gender" value="Female">
                        <label for="Female">Female</label>
                        <br>
                        <input type="radio" id="Rather Not Say" name="Gender" value="Rather Not Say">
                        <label for="Rather Not Say">Rather Not Say</label>
                    </div>
                </fieldset>
                <br>
                <fieldset style="background-color: lightpink;" class="form-item">
                    <legend style="text-align: center;"><strong>Your Address</strong></legend>
                    <br>

                    <label for="Street Address">Street Address</label>
                    <input type="text" id="Street Address" name="Street Address" maxlength="40" required>
                    <br><br>

                    <label for="Suburb/Town">Suburb/Town</label>
                    <input type="text" id="Suburb/Town" name="Suburb/Town" maxlength="40" required>
                    <br><br>

                    <label for="State">State</label>
                    <select id="State" name="State" required>
                        <option value="">Please Select</option>
                        <option value="VIC">VIC</option>
                        <option value="NSW">NSW</option>
                        <option value="QLD">QLD</option>
                        <option value="NT">NT</option>
                        <option value="WA">WA</option>
                        <option value="SA">SA</option>
                        <option value="TAS">TAS</option>
                        <option value="ACT">ACT</option>
                    </select>
                    <br><br>

                    <label for="Postcode">Postcode</label>
                    <input type="number" id="Postcode" name="Postcode" minlength="4" maxlength="4" required>
                    
                </fieldset>
                <br>
                <fieldset style="background-color: lightskyblue;" class="form-item">
                    <legend style="text-align: center;"><strong>Contacts</strong></legend>
                    <br>

                    <label for="Email">Email</label>
                    <input type="email" id="Email" name="Email" required>
                    <br><br>

                    <label for="Phone Number">Phone Number</label>
                    <input type="number" id="Phone Number" name="Phone Number" minlength="8" maxlength="12" required>
                    
                </fieldset>
                <br>
                <fieldset style="background-color: lightcyan;" class="form-item">
                    <legend style="text-align: center;"><strong>Your Skills</strong></legend>
                    <br>

                    <label for="Skill List"><strong>Skill List</strong></label>
                    <br>
                    <div>
                    <label><input type="checkbox" id="Loves The Environment" name="Skills[]" value="Loves The Environment" checked="checked">Loves The Environment</label>
                    <br>
                    <label><input type="checkbox" id="Organization" name="Skills[]" value="Organization">Organzation</label>
                    <br>
                    <label><input type="checkbox" id="Punctuality" name="Skills[]" value="Punctuality">Punctuality</label>
                    <br>
                    <label><input type="checkbox" id="Hard Working" name="Skills[]" value="Hard Working">Hard Working</label>
                    <br>
                    </div>
                    <div>
                    <label><input type="checkbox" id="Resilience" name="Skills[]" value="Resilience">Resilience</label>
                    <br>
                    <label><input type="checkbox" id="Team Player" name="Skills[]" value="Team Player">Team Player</label>
                    <br>
                    <label><input type="checkbox" id="Passionate" name="Skills[]" value="Passionate">Passionate</label>
                    <br>
                    <label><input type="checkbox" id="Leadership" name="Skills[]" value="Leadership">Leadership</label>
                    <br>
                    <label><input type="checkbox" id="Communication" name="Skills[]" value="Communication">Communication</label>
                    <br><br>
                    </div>

                    <label for="Other Skills"><strong>Other Skills</strong></label>
                    <br>
                    <textarea id="Other Skills" name="Other Skills" rows="8" cols="50" placeholder="Have more skills we didn't list? Tell us about them here!"></textarea>

                </fieldset>
                <br>
                <!--Buttons necessary for the form submission/reset-->
                <input type="submit" id="submit" name="submit" value="Submit Application">
                <input type="reset" id="reset" name="reset" value="Reset Application">
            </form>
        </main>
